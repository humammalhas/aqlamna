      <h1>سياسة الخصوصية</h1>
      <p class="version">الإصدار 1.0 — 30 تموز 2026</p>
    </header>

    <div class="prose">
      <p>أقلامنا أداة مفتوحة المصدر لكتابة القصص التفاعلية بالعربية. تملكها شركة المصير لبرامج وأنظمة الحاسوب ذ.م.م، المسجّلة في الأردن.</p>
      <p>هذه السياسة تشرح ما نجمعه عنك. الجواب المختصر: لا شيء.</p>

      <hr>

      <h2>لا حسابات ولا تسجيل دخول</h2>
      <p>لا نطلب بريدًا إلكترونيًّا ولا كلمة مرور ولا أيّ بيانات شخصية. لا يوجد تسجيل دخول من أيّ نوع.</p>

      <h2>لا خادم لنا</h2>
      <p>المحرّر موقع ثابت (static site). لا قاعدة بيانات ولا خادم خلفي ولا تخزين من جانبنا. قصصك لا تصلنا لأنها لا تغادر جهازك.</p>

      <h2>قصصك على جهازك فقط</h2>
      <p>القصص تُخزَّن في المتصفّح (IndexedDB) على جهازك أنت. إذا مسحتَ بيانات المتصفّح تُحذف القصص. لا نحتفظ بنسخة منها.</p>

      <h2>لا تتبّع ولا إعلانات</h2>
      <p>لا نستخدم ملفّات تتبّع (cookies)، ولا أدوات تحليل زيارات، ولا متتبّعات طرف ثالث، ولا إعلانات.</p>

      <h2>ميزات الذكاء الاصطناعي</h2>
      <p>ميزات الذكاء الاصطناعي اختيارية ومعطّلة تلقائيًّا. الكاتب يُدخل مفتاح API الخاصّ به ("أحضر مفتاحك") ويختار مزوّد الخدمة بنفسه.</p>
      <p>عندما يضغط الكاتب زرّ ذكاء اصطناعي — وفقط عندها — يُرسَل إلى المزوّد الذي اختاره:</p>
      <ul>
        <li>موجّه نظام يحتوي قواعد كتابة عربية</li>
        <li>نصّ القصة التي يعمل عليها</li>
        <li>أسماء المقاطع والمتغيّرات في تلك القصة</li>
      </ul>
      <p>لا يُرسَل شيء إلى شركة المصير. لا يُرسَل شيء عندما لا تُستخدم أزرار الذكاء الاصطناعي.</p>

      <h3>المزوّدون المدعومون</h3>
      <p>DeepSeek، OpenAI، Groq، Together AI، Mistral، Venice، OpenRouter، Anthropic، Google Gemini، Ollama، LM Studio، وأيّ نقطة اتصال متوافقة مع OpenAI.</p>
      <p>بمجرّد وصول النصّ إلى المزوّد، تحكمه سياسة خصوصية ذلك المزوّد. اقرأها قبل الاستخدام.</p>
      <p><strong>الخيار الأكثر خصوصية:</strong> Ollama وLM Studio يعملان على حاسوبك. اختيارهما يعني أنّ نصّ القصة لا يغادر جهازك.</p>

      <h3>تخزين مفتاح API</h3>
      <p>المفتاح يُخزَّن في localStorage بالمتصفّح، لكلّ مزوّد على حدة. المفتاح غير محميّ بتقنية تعمية — صفحة الويب لا تستطيع حمايته حماية حقيقية. المفتاح يُرسَل فقط إلى المزوّد الذي اخترته، ولا يُرسَل إلينا.</p>

      <h2>خدمة العامل (Service Worker)</h2>
      <p>خدمة عامل تحفظ ملفّات التطبيق ليعمل المحرّر دون اتصال. لا تحفظ طلبات الذكاء الاصطناعي ولا ردوده.</p>

      <h2>ملفّات القصص المصدَّرة</h2>
      <p>الملفّ المصدَّر (HTML) لا يحتوي متتبّعات ولا يُرسل طلبات شبكة. من يفتحه لا يُرسل بيانات لأحد.</p>

      <h2>الاستضافة</h2>
      <p>الموقع مستضاف على Cloudflare Pages. كأيّ مستضيف ويب، يعالج Cloudflare بيانات تقنية — عنوان IP، نوع المتصفّح، الطوابع الزمنية — لتقديم الموقع والحماية من سوء الاستخدام.</p>

      <h2>الأطفال</h2>
      <p>أقلامنا لا تجمع بيانات شخصية من أحد، بمن فيهم الأطفال. لا توجد ميزات تتبّع للطلاب أو الفصول الدراسية. إذا استخدم معلّم أقلامنا مع تلاميذه، فلا بيانات تلاميذ تصلنا ولا يخزّنها البرنامج.</p>

      <h2>القانون الحاكم</h2>
      <p>تخضع هذه السياسة لقوانين المملكة الأردنية الهاشمية.</p>

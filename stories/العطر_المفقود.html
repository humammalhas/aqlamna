/* ---------------------------------------------------------------------------
   Aqlamna light theme — cream + ink blue.
   Values match site/assets/aqlamna.css :root.
   --------------------------------------------------------------------------- */

/* --- Page ----------------------------------------------------------------- */
/* html AND body both carry the background. Setting it on .aq-story alone left
   white margins around a cream card on every exported story. */

html, body {
  margin: 0;
  padding: 0;
  min-block-size: 100%;
  background: #F6F1E7;
  color: #2B2721;
  -webkit-text-size-adjust: 100%;
}

* { box-sizing: border-box; }

/* --- Container ------------------------------------------------------------ */

.aq-story {
  direction: rtl;
  text-align: start;
  font-family:
    "IBM Plex Sans Arabic",
    "Noto Sans Arabic",
    "Amiri",
    "Tajawal",
    system-ui,
    sans-serif;
  font-size: 1.125rem;
  line-height: 1.85;
  color: #2B2721;
  background: #F6F1E7;
  max-inline-size: 42rem;
  margin-inline: auto;
  padding: 2rem 1.5rem;
}

/* --- Title ---------------------------------------------------------------- */

.aq-title {
  font-size: 1.75rem;
  font-weight: 700;
  color: #1F3A5F;
  text-align: center;
  margin-block-end: 2rem;
  border-block-end: 1px solid #D8CEBB;
  padding-block-end: 0.75rem;
}

/* --- Output / prose ------------------------------------------------------- */

.aq-output { margin-block-end: 1.5rem; }
.aq-text { margin-block: 0.75rem; text-indent: 0; }

/* --- Choices -------------------------------------------------------------- */

.aq-choices { display: flex; flex-direction: column; gap: 0.5rem; margin-block: 2rem; }

.aq-choice-btn {
  display: block; inline-size: 100%;
  padding-block: 0.75rem; padding-inline: 1.25rem;
  font-family: inherit; font-size: 1.0625rem; text-align: start;
  color: #2B2721; background: #EFE8DA;
  border: 1px solid #D8CEBB; border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.aq-choice-btn:hover { background: #E8E0CF; border-color: #5A5346; }
.aq-choice-btn:focus-visible { outline: 2px solid #1F3A5F; outline-offset: 2px; }

/* --- Images --------------------------------------------------------------- */

.aq-image {
  display: block;
  max-inline-size: 100%;
  block-size: auto;
  border-radius: 6px;
  margin-block: 1rem;
}

.aq-image-placeholder {
  display: block;
  max-inline-size: 100%;
  padding: 2rem;
  border: 2px dashed #D8CEBB;
  border-radius: 6px;
  margin-block: 1rem;
  text-align: center;
  color: #5A5346;
  font-size: 0.9375rem;
  line-height: 1.6;
}

/* --- End state ------------------------------------------------------------ */

.aq-end { text-align: center; margin-block: 3rem; }
.aq-end-text { font-size: 1.25rem; color: #1F3A5F; font-weight: 600; margin-block-end: 1.5rem; }

/* --- Toolbar -------------------------------------------------------------- */

.aq-toolbar {
  display: flex; justify-content: center; gap: 0.5rem;
  margin-block-start: 3rem; padding-block-start: 1.5rem;
  border-block-start: 1px solid #D8CEBB;
}

.aq-btn {
  padding-block: 0.5rem; padding-inline: 1rem;
  font-family: inherit; font-size: 0.875rem;
  color: #5A5346; background: transparent;
  border: 1px solid #D8CEBB; border-radius: 4px;
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.aq-btn:hover { color: #2B2721; border-color: #2B2721; }
.aq-btn:focus-visible { outline: 2px solid #1F3A5F; outline-offset: 2px; }

/* --- Feedback ------------------------------------------------------------- */
.aq-feedback { font-size: 0.8125rem; color: #5A5346; margin-inline-start: 0.5rem; align-self: center; }

/* --- Responsive ----------------------------------------------------------- */

.aq-choice-btn { min-block-size: 48px; }
.aq-btn { min-block-size: 44px; }

@media (max-width: 40rem) {
  .aq-story {
    padding-inline: 1.125rem;
    padding-block: 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
    font-size: 1.0625rem;
  }
  .aq-title { font-size: 1.375rem; }
  .aq-toolbar { flex-wrap: wrap; margin-block-start: 2rem; }
  .aq-btn { min-inline-size: 44px; }
}
</style>

<script>
(function () {
  var THEMES = ["light", "dark", "book"];
  var STORY_KEY = "العطر المفقود";

  function getTheme() {
    try { return localStorage.getItem("aq-theme-" + STORY_KEY) || "light"; }
    catch (e) { return "light"; }
  }

  function applyTheme(name) {
    for (var i = 0; i < THEMES.length; i++) {
      var el = document.getElementById("aq-theme-" + THEMES[i]);
      if (el) el.disabled = (THEMES[i] !== name);
    }
    try { localStorage.setItem("aq-theme-" + STORY_KEY, name); }
    catch (e) {}
  }

  window.__aqlamnaCycleTheme = function () {
    var current = getTheme();
    var idx = THEMES.indexOf(current);
    var next = THEMES[(idx + 1) % THEMES.length];
    applyTheme(next);
  };

  // Apply saved theme on load
  applyTheme(getTheme());
})();
</script>

(function () {

// Aqlamna runtime engine — state machine
// Zero dependencies. Consumes compiled story JSON.
// ---------------------------------------------------------------------------
// ---- engine ----------------------------------------------------------------
class Engine {
    story;
    state;
    constructor(story) {
        this.story = story;
        // Initialise variables from declarations
        const variables = {};
        for (const [name, decl] of Object.entries(story.variables)) {
            variables[name] = decl.initial;
        }
        // Initialise lists from declarations
        const lists = {};
        for (const [name, decl] of Object.entries(story.lists)) {
            lists[name] = decl.initial;
        }
        this.state = {
            passage: story.start ?? "",
            variables,
            lists,
            visited: {},
            consumed: {},
            ended: false,
        };
    }
    // ---- public API ----------------------------------------------------------
    /** Start the story from the current passage (or the declared start passage initially). */
    start() {
        if (this.state.ended) {
            return this.makeScene([], []);
        }
        return this.advance(this.state.passage);
    }
    /**
     * Select a choice by ID. The choice must be available at the current scene.
     * Processes the choice's content, applies side effects, then follows its divert
     * (or stays in the current passage if none).
     */
    choose(choiceId) {
        if (this.state.ended) {
            return this.makeScene([], []);
        }
        // Find the choice in the current passage content tree
        const passage = this.story.passages[this.state.passage];
        if (!passage) {
            this.state.ended = true;
            return this.makeScene([], []);
        }
        const item = this.findChoice(passage.content, choiceId);
        if (!item) {
            return this.makeScene([], []);
        }
        // Consume the choice (sticky choices are never consumed).
        // Keyed by (passage, choiceId) per PHASE1_SPEC.md §1.4.
        if (!item.sticky) {
            const passageConsumed = this.state.consumed[this.state.passage] ?? [];
            if (!passageConsumed.includes(choiceId)) {
                passageConsumed.push(choiceId);
                this.state.consumed[this.state.passage] = passageConsumed;
            }
        }
        // Process the choice's content
        const choiceOutput = [];
        const contentResult = this.processContent(item.content, choiceOutput);
        // If choice content itself contains choices (nested choices),
        // return immediately with the content output + those choices.
        if (contentResult.kind === "choices") {
            return this.makeScene(choiceOutput, contentResult.items);
        }
        // Determine the next passage:
        //   1. Content contains a divert node → follow it
        //   2. Choice has a divert field → follow it
        //   3. Neither → stay in current passage
        let nextPassage;
        if (contentResult.kind === "divert") {
            nextPassage = contentResult.target;
        }
        else if (item.divert !== null) {
            nextPassage = item.divert;
        }
        else {
            nextPassage = this.state.passage;
        }
        // Advance to the next passage, carrying choice content output as prefix
        return this.advance(nextPassage, choiceOutput);
    }
    /** Return a serialisable snapshot of the current engine state. */
    getState() {
        return {
            save_version: 2,
            passage: this.state.passage,
            variables: { ...this.state.variables },
            lists: { ...this.state.lists },
            visited: { ...this.state.visited },
            consumed: deepCloneConsumed(this.state.consumed),
            ended: this.state.ended,
        };
    }
    /** Restore the engine from a previously saved state. */
    loadState(state) {
        // Handle old v1 format: consumed was a flat string[].
        // Discard it gracefully — no real users yet.
        let consumed;
        if (Array.isArray(state.consumed)) {
            console.warn("تنسيق الحفظ قديم — جارٍ تجاهل الخيارات المستهلكة." +
                " القديم: مصفوفة، الجديد: لكل مقطع خياراته.");
            consumed = {};
        }
        else {
            consumed = deepCloneConsumed(state.consumed ?? {});
        }
        this.state = {
            save_version: 2,
            passage: state.passage,
            variables: { ...state.variables },
            lists: { ...state.lists },
            visited: { ...state.visited },
            consumed,
            ended: state.ended,
        };
    }
    // ---- advance loop --------------------------------------------------------
    /**
     * Process passages starting from `fromPassage`.
     * Follows diverts automatically. Pauses when choices are found or the story ends.
     */
    advance(fromPassage, prefixOutput) {
        const output = prefixOutput ? [...prefixOutput] : [];
        let current = fromPassage;
        for (;;) {
            // Terminal targets
            if (current === "END") {
                this.state.passage = "END";
                this.state.ended = true;
                return this.makeScene(output, []);
            }
            if (current === "DONE") {
                this.state.passage = "DONE";
                this.state.ended = true;
                return this.makeScene(output, []);
            }
            const passage = this.story.passages[current];
            if (!passage) {
                this.state.passage = current;
                this.state.ended = true;
                return this.makeScene(output, []);
            }
            this.state.passage = current;
            this.state.visited[current] = (this.state.visited[current] ?? 0) + 1;
            const result = this.processContent(passage.content, output);
            switch (result.kind) {
                case "divert":
                    current = result.target;
                    continue;
                case "choices":
                    return this.makeScene(output, result.items);
                case "done":
                    // Passage ended naturally with no divert and no choices.
                    // Just stay here.
                    return this.makeScene(output, []);
            }
        }
    }
    // ---- content processing --------------------------------------------------
    /**
     * Process an array of content nodes sequentially.
     * Returns:
     *   - { kind: "divert", target } when a divert/tunnel is hit
     *   - { kind: "choices", items } when choices are available
     *   - { kind: "done" } when all nodes are processed with no divert/choices
     */
    processContent(content, output) {
        for (const node of content) {
            switch (node.type) {
                case "text": {
                    // PHASE1_SPEC §1.16. The compiled JSON encodes a line break inside a
                    // paragraph as a text node whose value is null; a paragraph boundary
                    // is encoded implicitly, as two adjacent prose text nodes with no
                    // sentinel between them. Turn both into explicit output nodes here so
                    // the renderer never has to guess.
                    if (node.value === null) {
                        output.push({ type: "linebreak" });
                        break;
                    }
                    const last = output[output.length - 1];
                    if (last && last.type === "text" && !last.inline) {
                        output.push({ type: "paragraph" });
                    }
                    output.push({ type: "text", value: node.value });
                    break;
                }
                case "interpolation":
                    output.push({
                        type: "text",
                        value: String(this.resolveVar(node.var)),
                        inline: true,
                    });
                    break;
                case "set":
                    this.applySet(node);
                    break;
                case "divert":
                    return { kind: "divert", target: node.target };
                case "tunnel":
                    return { kind: "divert", target: node.target };
                case "divert_return":
                    // End of tunnel — signal done. The caller (advance loop)
                    // treats this as end-of-passage.
                    return { kind: "done" };
                case "thread": {
                    const tp = this.story.passages[node.target];
                    if (tp) {
                        const sub = this.processContent(tp.content, output);
                        if (sub.kind !== "done")
                            return sub;
                    }
                    break;
                }
                case "conditional": {
                    const branch = this.evalCondition(node.condition)
                        ? node.then
                        : node.else;
                    const sub = this.processContent(branch, output);
                    if (sub.kind !== "done")
                        return sub;
                    break;
                }
                case "image": {
                    const asset = this.story.images?.[node.name];
                    output.push({
                        type: "image",
                        alt: asset?.alt ?? node.name,
                        data: asset?.data,
                    });
                    break;
                }
                case "choices": {
                    const available = node.items.filter((item) => this.isChoiceAvailable(item));
                    if (available.length > 0) {
                        return {
                            kind: "choices",
                            items: available.map((item) => ({
                                id: item.id,
                                label: item.label,
                                sticky: item.sticky,
                            })),
                        };
                    }
                    // No available choices — continue processing
                    break;
                }
            }
        }
        return { kind: "done" };
    }
    // ---- condition evaluation ------------------------------------------------
    isChoiceAvailable(item) {
        // Per-passage consumed check: look up consumed IDs for the current passage
        if (!item.sticky) {
            const passageConsumed = this.state.consumed[this.state.passage] ?? [];
            if (passageConsumed.includes(item.id)) {
                return false;
            }
        }
        if (item.condition !== null && !this.evalCondition(item.condition)) {
            return false;
        }
        return true;
    }
    evalCondition(cond) {
        if ("var" in cond) {
            return this.evalVar(cond);
        }
        if ("not" in cond) {
            return !this.evalCondition(cond.not);
        }
        if ("and" in cond) {
            return cond.and.every((c) => this.evalCondition(c));
        }
        if ("or" in cond) {
            return cond.or.some((c) => this.evalCondition(c));
        }
        return false;
    }
    evalVar(cond) {
        const value = this.state.variables[cond.var];
        if (cond.op === undefined && cond.value === undefined) {
            return Boolean(value);
        }
        const op = cond.op;
        const expected = cond.value;
        switch (op) {
            case "==": return value === expected;
            case "!=": return value !== expected;
            case "<": return value < expected;
            case ">": return value > expected;
            case "<=": return value <= expected;
            case ">=": return value >= expected;
            default: return false;
        }
    }
    // ---- variable operations -------------------------------------------------
    resolveVar(name) {
        if (name in this.state.variables)
            return this.state.variables[name];
        if (name in this.state.lists)
            return this.state.lists[name];
        return 0;
    }
    applySet(node) {
        const varName = node.var;
        const op = node.op ?? "=";
        const rhs = node.value;
        // Lists
        if (varName in this.state.lists) {
            if (op === "=")
                this.state.lists[varName] = String(rhs);
            return;
        }
        // Ensure variable exists (auto-create if referenced without declare)
        if (!(varName in this.state.variables)) {
            this.state.variables[varName] = 0;
        }
        const current = this.state.variables[varName];
        switch (op) {
            case "=":
                this.state.variables[varName] = rhs;
                break;
            case "+=":
                this.state.variables[varName] = current + rhs;
                break;
            case "-=":
                this.state.variables[varName] = current - rhs;
                break;
            case "*=":
                this.state.variables[varName] = current * rhs;
                break;
            case "/=":
                this.state.variables[varName] = Math.trunc(current / rhs);
                break;
        }
    }
    // ---- helpers -------------------------------------------------------------
    makeScene(output, choices) {
        return {
            passage: this.state.passage,
            output,
            choices,
            ended: this.state.ended,
        };
    }
    /** Recursively find a choice by ID anywhere in the content tree. */
    findChoice(content, choiceId) {
        for (const node of content) {
            if (node.type === "choices") {
                for (const item of node.items) {
                    if (item.id === choiceId)
                        return item;
                    const nested = this.findChoice(item.content, choiceId);
                    if (nested)
                        return nested;
                }
            }
            if (node.type === "conditional") {
                const inThen = this.findChoice(node.then, choiceId);
                if (inThen)
                    return inThen;
                const inElse = this.findChoice(node.else, choiceId);
                if (inElse)
                    return inElse;
            }
            if (node.type === "thread") {
                const tp = this.story.passages[node.target];
                if (tp) {
                    const inThread = this.findChoice(tp.content, choiceId);
                    if (inThread)
                        return inThread;
                }
            }
        }
        return null;
    }
}
// ---- helpers (module-level) ------------------------------------------------
/** Deep-clone the per-passage consumed map. */
function deepCloneConsumed(consumed) {
    const clone = {};
    for (const [key, ids] of Object.entries(consumed)) {
        clone[key] = [...ids];
    }
    return clone;
}

// Zero dependencies. Uses CSS logical properties only.

/**
 * Renders a story scene into a container element.
 * Creates RTL-first DOM with choice buttons.
 */
function renderScene(container, scene, title, options) {
    container.innerHTML = "";
    // Story wrapper
    const wrapper = document.createElement("div");
    wrapper.className = "aq-story";
    // Title
    if (title) {
        const titleEl = document.createElement("h1");
        titleEl.className = "aq-title";
        titleEl.textContent = title;
        wrapper.appendChild(titleEl);
    }
    // Output area — PHASE1_SPEC §1.16.
    //   text        → a run of prose inside the current paragraph
    //   linebreak   → <br> inside the current paragraph
    //   paragraph   → close the current <p> and open a new one
    //   image       → close the current <p>, then emit the figure
    // Text arising from text + interpolation + text stays in one paragraph
    // because the engine emits no `paragraph` node between them.
    const outputEl = document.createElement("div");
    outputEl.className = "aq-output";
    // null sentinel means <br>; string means a text run
    const run = [];
    function flushRun() {
        // A run of nothing but line breaks is not a paragraph — drop it rather
        // than emitting an empty <p> that pushes the prose around.
        if (!run.some((item) => item !== null && item !== "")) {
            run.length = 0;
            return;
        }
        const p = document.createElement("p");
        p.className = "aq-text";
        for (const item of run) {
            if (item === null) {
                p.appendChild(document.createElement("br"));
            }
            else {
                p.appendChild(document.createTextNode(item));
            }
        }
        outputEl.appendChild(p);
        run.length = 0;
    }
    for (const node of scene.output) {
        if (node.type === "text") {
            run.push(node.value);
        }
        else if (node.type === "linebreak") {
            run.push(null);
        }
        else if (node.type === "paragraph") {
            flushRun();
        }
        else if (node.type === "image") {
            flushRun();
            outputEl.appendChild(renderImage(node));
        }
    }
    flushRun();
    wrapper.appendChild(outputEl);
    // Choices
    if (scene.choices.length > 0) {
        const choicesEl = document.createElement("div");
        choicesEl.className = "aq-choices";
        for (const choice of scene.choices) {
            const btn = document.createElement("button");
            btn.className = "aq-choice-btn";
            btn.textContent = choice.label;
            btn.addEventListener("click", () => {
                options.onChoice(choice.id);
            });
            choicesEl.appendChild(btn);
        }
        wrapper.appendChild(choicesEl);
    }
    // End state
    if (scene.ended && scene.choices.length === 0) {
        const endEl = document.createElement("div");
        endEl.className = "aq-end";
        const endText = document.createElement("p");
        endText.className = "aq-text aq-end-text";
        endText.textContent = "انتهت القصة.";
        endEl.appendChild(endText);
        const restartBtn = document.createElement("button");
        restartBtn.className = "aq-btn aq-restart-btn";
        restartBtn.textContent = "⟲ أعد القصة";
        restartBtn.addEventListener("click", options.onRestart);
        endEl.appendChild(restartBtn);
        wrapper.appendChild(endEl);
    }
    // Toolbar
    const toolbar = document.createElement("div");
    toolbar.className = "aq-toolbar";
    const saveBtn = document.createElement("button");
    saveBtn.className = "aq-btn aq-save-btn";
    saveBtn.textContent = "💾 حفظ";
    saveBtn.addEventListener("click", () => {
        const msg = options.onSave();
        showFeedback(toolbar, msg);
    });
    const loadBtn = document.createElement("button");
    loadBtn.className = "aq-btn aq-load-btn";
    loadBtn.textContent = "📂 استعادة";
    loadBtn.addEventListener("click", async () => {
        const msg = await options.onLoad();
        showFeedback(toolbar, msg);
    });
    toolbar.appendChild(saveBtn);
    toolbar.appendChild(loadBtn);
    // Theme toggle button — only shown if callback is provided
    if (options.onThemeToggle) {
        const themeBtn = document.createElement("button");
        themeBtn.className = "aq-btn aq-theme-btn";
        themeBtn.textContent = "🎨";
        themeBtn.title = "تغيير المظهر";
        themeBtn.addEventListener("click", options.onThemeToggle);
        toolbar.appendChild(themeBtn);
    }
    if (scene.choices.length > 0 || !scene.ended) {
        const restartBtn = document.createElement("button");
        restartBtn.className = "aq-btn aq-restart-btn";
        restartBtn.textContent = "⟲ أعد";
        restartBtn.addEventListener("click", options.onRestart);
        toolbar.appendChild(restartBtn);
    }
    wrapper.appendChild(toolbar);
    container.appendChild(wrapper);
}
function showFeedback(toolbar, msg) {
    const old = toolbar.querySelector(".aq-feedback");
    if (old)
        old.remove();
    const span = document.createElement("span");
    span.className = "aq-feedback";
    span.textContent = msg;
    toolbar.appendChild(span);
    setTimeout(() => {
        if (span.parentNode)
            span.remove();
    }, 2000);
}
/**
 * Render an image output node.
 * With `data`: emits <img src="data:..." alt="desc">.
 * Without `data`: emits a bordered placeholder showing the Arabic description.
 */
function renderImage(node) {
    if (node.data) {
        const img = document.createElement("img");
        img.className = "aq-image";
        img.src = node.data;
        img.alt = node.alt;
        return img;
    }
    const placeholder = document.createElement("div");
    placeholder.className = "aq-image-placeholder";
    placeholder.textContent = node.alt;
    return placeholder;
}
// ---------------------------------------------------------------------------
// Aqlamna runtime save/restore — localStorage + download/upload
// Zero dependencies.
// ---------------------------------------------------------------------------
const STORAGE_KEY_PREFIX = "aqlamna_save_";
/**
 * Save game state to localStorage under a story-specific key.
 * Returns the key used.
 */
function saveToLocalStorage(storyTitle, state) {
    const key = STORAGE_KEY_PREFIX + sanitiseKey(storyTitle);
    const data = JSON.stringify(state);
    localStorage.setItem(key, data);
    return key;
}
/**
 * Restore game state from localStorage.
 * Returns null if no save exists for this story.
 */
function loadFromLocalStorage(storyTitle) {
    const key = STORAGE_KEY_PREFIX + sanitiseKey(storyTitle);
    const raw = localStorage.getItem(key);
    if (!raw)
        return null;
    try {
        const parsed = JSON.parse(raw);
        // Basic validation
        if (typeof parsed.passage !== "string" ||
            typeof parsed.variables !== "object" ||
            typeof parsed.consumed !== "object") {
            return null;
        }
        // Handle old v1 format: consumed was a flat string[].
        if (Array.isArray(parsed.consumed)) {
            console.warn("تنسيق الحفظ قديم — جارٍ تجاهل الخيارات المستهلكة." +
                " القديم: مصفوفة، الجديد: لكل مقطع خياراته.");
            parsed.consumed = {};
        }
        return parsed;
    }
    catch {
        return null;
    }
}
/**
 * Download state as a JSON file.
 */
function downloadSave(storyTitle, state) {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${sanitiseKey(storyTitle)}_save.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
/**
 * Trigger a file picker to load state from a JSON file.
 * Returns a Promise that resolves with the parsed state, or null if cancelled/invalid.
 */
function uploadSave() {
    return new Promise((resolve) => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json";
        input.addEventListener("change", () => {
            const file = input.files?.[0];
            if (!file) {
                resolve(null);
                return;
            }
            const reader = new FileReader();
            reader.addEventListener("load", () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (typeof parsed.passage !== "string" ||
                        typeof parsed.variables !== "object" ||
                        typeof parsed.consumed !== "object") {
                        resolve(null);
                        return;
                    }
                    if (Array.isArray(parsed.consumed)) {
                        console.warn("تنسيق الحفظ قديم — جارٍ تجاهل الخيارات المستهلكة." +
                            " القديم: مصفوفة، الجديد: لكل مقطع خياراته.");
                        parsed.consumed = {};
                    }
                    resolve(parsed);
                }
                catch {
                    resolve(null);
                }
            });
            reader.addEventListener("error", () => resolve(null));
            reader.readAsText(file);
        });
        // Handle cancel
        input.addEventListener("cancel", () => resolve(null));
        input.click();
    });
}
function sanitiseKey(title) {
    // Remove unsafe characters for localStorage key
    return title.replace(/[^a-zA-Z\u0600-\u06FF0-9_-]/g, "_").slice(0, 64);
}


// ---- Aqlamna standalone bootstrap -----------------------------------------
(function () {
  var storyEl = document.getElementById("qalam-story");
  if (!storyEl) return;
  var story = JSON.parse(storyEl.textContent);
  var engine = new Engine(story);
  var root = document.getElementById("qalam-player");
  if (!root) return;

  function render(scene) {
    renderScene(root, scene, story.title, {
      onChoice: function (choiceId) {
        var next = engine.choose(choiceId);
        render(next);
      },
      onRestart: function () {
        engine = new Engine(story);
        render(engine.start());
      },
      onSave: function () {
        try {
          saveToLocalStorage(story.title || "قصة", engine.getState());
          return "تم الحفظ";
        } catch (e) {
          return "تعذّر الحفظ";
        }
      },
      onLoad: function () {
        try {
          var saved = loadFromLocalStorage(story.title || "قصة");
          if (saved) {
            engine.loadState(saved);
            render(engine.start());
            return "تم التحميل";
          }
          return "لا يوجد حفظ محفوظ";
        } catch (e) {
          return "تعذّر التحميل";
        }
      },
    });
  }

  render(engine.start());
})();

})();
</script>

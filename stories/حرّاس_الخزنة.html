<style id="aq-theme-light">
/* ---------------------------------------------------------------------------
   Aqlamna light theme — cream + ink blue.
   Values match site/assets/aqlamna.css :root.
   --------------------------------------------------------------------------- */

/* --- Page ----------------------------------------------------------------- */
/* html AND body both carry the background. Setting it on .aq-story alone left
   white margins around a cream card on every exported story. */

html, body {
  margin: 0;
  padding: 0;
  min-block-size: 100%;
  background: #F6F1E7;
  color: #2B2721;
  -webkit-text-size-adjust: 100%;
}

* { box-sizing: border-box; }

/* --- Container ------------------------------------------------------------ */

.aq-story {
  direction: rtl;
  text-align: start;
  font-family:
    "IBM Plex Sans Arabic",
    "Noto Sans Arabic",
    "Amiri",
    "Tajawal",
    system-ui,
    sans-serif;
  font-size: 1.125rem;
  line-height: 1.85;
  color: #2B2721;
  background: #F6F1E7;
  max-inline-size: 42rem;
  margin-inline: auto;
  padding: 2rem 1.5rem;

  /* The ink blue this theme already uses for the title and the end line. Named
     here so .aq-after-choice reads a token rather than repeating a hex. */
  --aq-after-choice: #1F3A5F;
}

/* --- Title ---------------------------------------------------------------- */

.aq-title {
  font-size: 1.75rem;
  font-weight: 700;
  color: #1F3A5F;
  text-align: center;
  margin-block-end: 2rem;
  border-block-end: 1px solid #D8CEBB;
  padding-block-end: 0.75rem;
}

/* --- Output / prose ------------------------------------------------------- */

.aq-output { margin-block-end: 1.5rem; }
.aq-text { margin-block: 0.75rem; text-indent: 0; }

/* The line a choice carries with it — the answer to the reader's own click,
   not part of the passage it lands in. Weight AND colour, because either alone
   reads as emphasis inside the prose rather than as a different voice. */
.aq-after-choice {
  font-weight: 700;
  color: var(--aq-after-choice);
  text-indent: 0;
}

/* --- Choices -------------------------------------------------------------- */

.aq-choices { display: flex; flex-direction: column; gap: 0.5rem; margin-block: 2rem; }

.aq-choice-btn {
  display: block; inline-size: 100%;
  padding-block: 0.75rem; padding-inline: 1.25rem;
  font-family: inherit; font-size: 1.0625rem; text-align: start;
  color: #2B2721; background: #EFE8DA;
  border: 1px solid #D8CEBB; border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.aq-choice-btn:hover { background: #E8E0CF; border-color: #5A5346; }
.aq-choice-btn:focus-visible { outline: 2px solid #1F3A5F; outline-offset: 2px; }

/* --- Images --------------------------------------------------------------- */

.aq-image {
  display: block;
  max-inline-size: 100%;
  block-size: auto;
  border-radius: 6px;
  margin-block: 1rem;
}

.aq-image-placeholder {
  display: block;
  max-inline-size: 100%;
  padding: 2rem;
  border: 2px dashed #D8CEBB;
  border-radius: 6px;
  margin-block: 1rem;
  text-align: center;
  color: #5A5346;
  font-size: 0.9375rem;
  line-height: 1.6;
}

/* --- End state ------------------------------------------------------------ */

.aq-end { text-align: center; margin-block: 3rem; }
.aq-end-text { font-size: 1.25rem; color: #1F3A5F; font-weight: 600; margin-block-end: 1.5rem; }

/* --- Toolbar -------------------------------------------------------------- */

.aq-toolbar {
  display: flex; justify-content: center; gap: 0.5rem;
  margin-block-start: 3rem; padding-block-start: 1.5rem;
  border-block-start: 1px solid #D8CEBB;
}

.aq-btn {
  padding-block: 0.5rem; padding-inline: 1rem;
  font-family: inherit; font-size: 0.875rem;
  color: #5A5346; background: transparent;
  border: 1px solid #D8CEBB; border-radius: 4px;
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.aq-btn:hover { color: #2B2721; border-color: #2B2721; }
.aq-btn:focus-visible { outline: 2px solid #1F3A5F; outline-offset: 2px; }

/* --- Feedback ------------------------------------------------------------- */
.aq-feedback { font-size: 0.8125rem; color: #5A5346; margin-inline-start: 0.5rem; align-self: center; }

/* --- Responsive ----------------------------------------------------------- */

.aq-choice-btn { min-block-size: 48px; }
.aq-btn { min-block-size: 44px; }

@media (max-width: 40rem) {
  .aq-story {
    padding-inline: 1.125rem;
    padding-block: 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
    font-size: 1.0625rem;
  }
  .aq-title { font-size: 1.375rem; }
  .aq-toolbar { flex-wrap: wrap; margin-block-start: 2rem; }
  .aq-btn { min-inline-size: 44px; }
}
</style>

<script>
(function () {
  var THEMES = ["light", "dark", "book"];
  var STORY_KEY = "حرّاس الخزنة";

  function getTheme() {
    try { return localStorage.getItem("aq-theme-" + STORY_KEY) || "light"; }
    catch (e) { return "light"; }
  }

  function applyTheme(name) {
    for (var i = 0; i < THEMES.length; i++) {
      var el = document.getElementById("aq-theme-" + THEMES[i]);
      if (el) el.disabled = (THEMES[i] !== name);
    }
    try { localStorage.setItem("aq-theme-" + STORY_KEY, name); }
    catch (e) {}
  }

  window.__aqlamnaCycleTheme = function () {
    var current = getTheme();
    var idx = THEMES.indexOf(current);
    var next = THEMES[(idx + 1) % THEMES.length];
    applyTheme(next);
  };

  // Apply saved theme on load
  applyTheme(getTheme());
})();
</script>

{"qalam_version":"0.1","title":"حرّاس الخزنة","author":"هُمام ملحس","language":"ar","direction":"rtl","start":"كهف_الجد","variables":{"رمز_ذي_الشرى":{"type":"boolean","initial":false},"معه_القطعة_الأولى":{"type":"boolean","initial":false},"درب_سري":{"type":"boolean","initial":false},"اسم_الملك":{"type":"boolean","initial":false},"القطع":{"type":"number","initial":0}},"lists":{},"passages":{"كهف_الجد":{"tags":[],"content":[{"type":"image","name":"الجديدة"},{"type":"text","value":"صعد عوده إلى الكهف قبل أن تشتدّ الشمس، حيث عاش جدّه قبل أن يُنقلوا إلى أمّ صيحون. لمس الجدارَ الباردَ، فعلِقت بيده رائحةُ الدخان القديم التي لم تفارق الحجر منذ سنوات. جلس عند موضع الموقد، ونكش الرمادَ المتحجّر بأصابعه، فبان تجويفٌ صغير خلف حجرٍ مرتخٍ. أخرج منه صرّةً من قماشٍ بالٍ، ففكّها على مهل. في داخلها ثلثُ ميداليةٍ من البرونز، وورقةٌ طواها جدّه بخطٍّ مرتجف، عليها رمزٌ محفور: ذو الشرى، إله الأنباط. تحت الرمز سطرٌ واحد: \"ما خبّأه الملك ثلاثةٌ لا واحد، وأوّل الدرب عند الدير.\""},{"type":"choices","items":[{"id":"choice_1","label":"افحص جدران الكهف","sticky":true,"condition":null,"content":[{"type":"text","value":"مرّر عوده كفّه على الصخر، فلم يجد إلّا نقوشًا محاها الزمن."}],"divert":"كهف_الجد"},{"id":"choice_2","label":"تأمّل رمز ذي الشرى واحفظه","sticky":false,"condition":null,"content":[{"type":"set","var":"رمز_ذي_الشرى","op":"=","value":true}],"divert":"كهف_الجد"},{"id":"choice_3","label":"دُسّ الصرّة في جيبك واهبط إلى الوادي","sticky":true,"condition":null,"content":[{"type":"set","var":"معه_القطعة_الأولى","op":"=","value":true},{"type":"set","var":"القطع","op":"+=","value":1}],"divert":"الوادي"}]}]},"الوادي":{"tags":[],"content":[{"type":"image","name":"الوادي"},{"type":"text","value":"هبط عوده الدربَ الحجريّ نحو قاع الوادي، والحصى تتدحرج تحت نعله. عند منعطف الصخر رأى ثلاثة رجالٍ لا يشبهون السيّاح: يحملون آلات مسحٍ، ويصوّرون فتحات الكهوف واحدةً واحدة. تقدّم منه أطولهم وعرّف عن نفسه: الدكتور مورغان. ابتسم ابتسامةً باردة، وقال بعربيّةٍ متأنّية: \"سمعنا أنّ جدّك ترك لك شيئًا قديمًا. نحن نحفظ هذه الأشياء في متاحفنا، وندفع جيّدًا.\" لمس عوده جيبه حيث القطعة، فأحسّ بثقلها البارد. عرف أنّ الطريق إلى الدير طويل، وأنّ هؤلاء لن يتركوه."},{"type":"choices","items":[{"id":"choice_1","label":"اصعد الدرج الطويل إلى الدير","sticky":true,"condition":null,"content":[],"divert":"درج_الدير"},{"id":"choice_2","label":"تسلّل عبر درب الماعز الذي علّمك إيّاه جدّك","sticky":true,"condition":null,"content":[{"type":"set","var":"درب_سري","op":"=","value":true}],"divert":"درب_الماعز"}]}]},"درج_الدير":{"tags":[],"content":[{"type":"image","name":"درج_الدير"},{"type":"text","value":"صعد عوده مئات الدرجات المنحوتة في الجبل، فاشتعلت ساقاه وتصبّب العرق على ظهره. تجاوز باعةَ التحف والحميرَ المحمّلة، ولمح بين الحين والآخر رجال مورغان يتبعونه من بعيد. حين بلغ القمّة، انفتح أمامه الديرُ الضخم منحوتًا في الصخر، وهبّت ريحٌ باردة على وجهه المبلّل."},{"type":"choices","items":[{"id":"choice_1","label":"ادخل قاعة الدير","sticky":true,"condition":null,"content":[],"divert":"قاعة_الدير"}]}]},"درب_الماعز":{"tags":[],"content":[{"type":"image","name":"درب_الماعز"},{"type":"text","value":"تسلّل عوده في ممرٍّ ضيّق بين الصخور، لا يعرفه إلّا رعاةُ البدول. سار على حافّةٍ لا تتّسع إلّا لقدمٍ واحدة، ورائحةُ الزعتر البرّيّ تفوح من الشقوق. لم يسمع خلفه إلّا صوت الريح؛ فقد ضلّ عنه رجال مورغان. خرج فجأةً خلف الدير، حيث لا يصل السيّاح."},{"type":"choices","items":[{"id":"choice_1","label":"ادخل قاعة الدير","sticky":true,"condition":null,"content":[],"divert":"قاعة_الدير"}]}]},"قاعة_الدير":{"tags":[],"content":[{"type":"image","name":"قاعة_الدير"},{"type":"text","value":"دخل عوده قاعةً محفورةً خلف واجهة الدير، فغمره هواءٌ باردٌ رطب. تردّد صدى نفَسه على الجدران. في العمق ثلاثةُ محاريبَ منحوتة، وفوقها سطرٌ من الكتابة النبطية القديمة، وتحتها شقٌّ ضيّق يتّسع لثلثِ ميدالية. عليه أن يلمس المحراب الذي يمثّل ذا الشرى؛ فإن أخطأ أُطبق البابُ خلفه."},{"type":"conditional","condition":{"var":"رمز_ذي_الشرى"},"then":[{"type":"text","value":"تذكّر عوده ما حفظه من ورقة جدّه: الأنباط لا يرسمون آلهتهم بوجوه، فذو الشرى عندهم حجرٌ قائمٌ أملس لا ملامح له."}],"else":[]},{"type":"conditional","condition":{"not":{"var":"رمز_ذي_الشرى"}},"then":[{"type":"text","value":"حدّق عوده في الرموز الباهتة فلم يفهم منها شيئًا. لم يقرأ ورقة جدّه بعناية، فبقيت المحاريب لغزًا."}],"else":[]},{"type":"conditional","condition":{"var":"درب_سري"},"then":[{"type":"text","value":"لا صوت لرجال مورغان هنا؛ لقد سبقهم بالدرب الخفيّ، فله متّسعٌ من الوقت."}],"else":[]},{"type":"choices","items":[{"id":"choice_1","label":"المِسّ النُّصُب الحجريّ الأملس","sticky":true,"condition":null,"content":[{"type":"set","var":"اسم_الملك","op":"=","value":true},{"type":"set","var":"القطع","op":"+=","value":1}],"divert":"القطعة_الثانية"},{"id":"choice_2","label":"المِسّ التمثال المنحوت وجهُه","sticky":true,"condition":null,"content":[],"divert":"العقرب"},{"id":"choice_3","label":"المِسّ نقشَ النسر","sticky":true,"condition":null,"content":[],"divert":"العقرب"}]}]},"القطعة_الثانية":{"tags":[],"content":[{"type":"image","name":"القطعة_الثانية"},{"type":"text","value":"انزاح النُّصُب بهدوء، فظهر خلفه تجويفٌ صغير. مدّ عوده يده وأخرج ثلثًا آخر من الميدالية، بارِدًا لامعًا. على جدار التجويف اسمٌ محفور بوضوح: الحارث الرابع، ملكُ الأنباط، محبُّ شعبه. تحت الاسم سهمٌ منقوش يشير نحو الخزنة."},{"type":"choices","items":[{"id":"choice_1","label":"اخرج نحو الخزنة","sticky":true,"condition":null,"content":[],"divert":"الطريق_إلى_الخزنة"}]}]},"العقرب":{"tags":[],"content":[{"type":"image","name":"العقرب"},{"type":"text","value":"ما إن لمس عوده الحجرَ حتى دوّى صريرٌ، فانزلق بابٌ صخريّ وأطبق على المدخل. غرقت القاعة في ظلامٍ إلّا من شقٍّ رفيع. سمع حفيفًا عند قدمه، فرأى عقربًا صفراء ترفع ذيلها فوق الرمل. أسند ظهره إلى الجدار البارد، والقطعةُ في جيبه لا تنفعه."},{"type":"divert","target":"END"}]},"الطريق_إلى_الخزنة":{"tags":[],"content":[{"type":"image","name":"الطريق_إلى_الخزنة"},{"type":"text","value":"عاد عوده يشقّ السيق نحو الخزنة، والقطعتان في جيبه. ضاق الممرّ حتى كاد الصخرُ يلامس كتفيه، وبرَد الظلّ فجأة. لمعت في الجدار قناةُ ماءٍ نبطية قديمة، ما زالت تنقل رطوبةً خافتة. عند نهاية السيق تراءت الخزنةُ ورديةً في ضوء العصر، لكنّ ثلاثة ظلالٍ تحرّكت أمام بابها: رجالُ مورغان سبقوه."},{"type":"choices","items":[{"id":"choice_1","label":"تقدّم نحو الخزنة","sticky":true,"condition":null,"content":[],"divert":"أمام_الخزنة"}]}]},"أمام_الخزنة":{"tags":[],"content":[{"type":"image","name":"أمام_الخزنة"},{"type":"text","value":"وقف عوده عند مدخل الساحة، والخزنةُ تعلوه بأعمدتها المنحوتة. تقدّم مورغان بهدوء، ومدّ يده: \"القطعُ يا بنيّ، قبل أن نأخذها بأنفسنا.\" انتشر الرجلان على جانبيه. لمح عوده بابًا جانبيًّا صغيرًا منحوتًا في حرف الخزنة، مظلمًا وضيّقًا."},{"type":"choices","items":[{"id":"choice_1","label":"اركض عبر الساحة المكشوفة","sticky":true,"condition":null,"content":[],"divert":"الأسر"},{"id":"choice_2","label":"قاتلهم بيديك","sticky":true,"condition":null,"content":[{"type":"text","value":"اندفع عوده بجُمعِ يده نحو أقربهم، لكنّهم كانوا ثلاثةً وهو وحده، فأطبقوا عليه وطرحوه على الحصى."}],"divert":"الأسر"},{"id":"choice_3","label":"تسلّل إلى الغرفة الجانبية","sticky":true,"condition":null,"content":[],"divert":"غرفة_الخزنة"}]}]},"غرفة_الخزنة":{"tags":[],"content":[{"type":"image","name":"غرفة_الخزنة"},{"type":"text","value":"تسلّل عوده إلى غرفةٍ جانبيةٍ مظلمة، حيث أشار سهمُ القطعة الثانية. سكن كلُّ صوتٍ خلفه. في وسطها مذبحٌ حجريّ، وعليه قفلٌ دائريّ تحيط به ثلاثةُ أختام. وفي كوّةٍ فوق المذبح رقدَ ثلثُ الميدالية الأخير، خبّأه الأنباط عند باب كنزهم لِيُجمَع هنا لا في مكانٍ آخر. أخذه عوده وضمّ الأثلاثَ الثلاثة، فالتأمت قرصًا واحدًا انزلق في قلب القفل. فوق الأختام سطرٌ محفور: \"افتح بما أحبّه الملكُ لشعبه.\""},{"type":"conditional","condition":{"var":"اسم_الملك"},"then":[{"type":"text","value":"تذكّر عوده اللقب المحفور: الحارث الرابع، محبُّ شعبه. وسأل نفسه: ماذا يترك مَن يحبّ شعبه؟ لا ذهبًا يُنهب، بل ما يبقى بعده."}],"else":[]},{"type":"conditional","condition":{"not":{"var":"اسم_الملك"}},"then":[{"type":"text","value":"ثلاثة أختامٍ متشابهة، ولا يذكر عوده ما يدلّ على الصحيح."}],"else":[]},{"type":"choices","items":[{"id":"choice_1","label":"ضغط ختم المخطوطة","sticky":true,"condition":null,"content":[],"divert":"الكنز"},{"id":"choice_2","label":"اضغط ختم كِيس الذهب","sticky":true,"condition":null,"content":[],"divert":"الأبواب"},{"id":"choice_3","label":"اضغط ختم التاج","sticky":true,"condition":null,"content":[],"divert":"الأبواب"}]}]},"الأسر":{"tags":[],"content":[{"type":"image","name":"الأسر"},{"type":"text","value":"لم يقطع عوده نصف الساحة حتى أطبقت عليه أيدٍ قويّة. انتزع مورغان القطعتين من جيبه، ورفعهما في الضوء، وابتسم. جُرَّ عوده على الحصى، والخزنةُ تبتعد خلفه، والقطعتان في يدٍ غريبة."},{"type":"divert","target":"END"}]},"الأبواب":{"tags":[],"content":[{"type":"image","name":"الأبواب"},{"type":"text","value":"ما إن ضغط الختمَ حتى دوّى صريرٌ عميق، فبدأت جدرانُ الغرفة تنزلق نحو بعضها ببطءٍ لا يُقاوَم. ركض عوده نحو المدخل، فانطبق الحجرُ قبل أن يبلغه بإصبعين. ساد الظلامُ التامّ، ولم يبقَ إلّا صوتُ أنفاسه والقرصُ الباردُ في يده."},{"type":"divert","target":"END"}]},"الكنز":{"tags":[],"content":[{"type":"image","name":"الكنز"},{"type":"text","value":"دار الختمُ ببطء، فاهتزّ الجدارُ وانفرج عن حجرةٍ ضيّقة. لم يجد عوده ذهبًا مكوّمًا كما ظنّ مورغان، بل رفوفًا من اللفائف النبطية: خرائطَ لقنوات الماء التي أحيت الصحراء، وسجلّاتٍ لأسماء عائلاتٍ سكنت هذه الجبال قبل ألفَي عام. لم تكن بينها إلّا قطعةٌ ذهبيةٌ واحدة، تكاد تضيع بين الورق. حمل عوده لفافةً هشّةً نحو فم الغرفة حيث يتسرّب ضوءُ النهار، وفي الأعلى لاحت جرّةُ الخزنة الحجرية التي ثقبتها رصاصاتُ الطامعين بحثًا عن ذهبٍ لم يكن فيها قطّ."},{"type":"divert","target":"END"}]}},"metadata":{"created":"2026-08-02T06:29:35.037Z","modified":"2026-08-02T06:29:35.037Z","passage_count":13,"word_count":780},"images":{"الجديدة":{"alt":"عوده يجلس القرفصاء داخل كهفٍ محفور في صخر البترا الورديّ، يفتح صرّةً من قماشٍ بين يديه، وشعاعُ ضوءٍ يدخل من فم الكهف فيضيء الغبار المعلّق في الهواء.","data":"data:image/webp;base64,UklGRlDlAABXRUJQVlA4WAoAAAAgAAAA/wIAPwIASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA <script>
(function () {
// ---------------------------------------------------------------------------
// Aqlamna runtime types — the story JSON shape the engine consumes
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Aqlamna runtime engine — state machine
// Zero dependencies. Consumes compiled story JSON.
// ---------------------------------------------------------------------------
// ---- engine ----------------------------------------------------------------
class Engine {
    story;
    state;
    constructor(story) {
        this.story = story;
        // Initialise variables from declarations
        const variables = {};
        for (const [name, decl] of Object.entries(story.variables)) {
            variables[name] = decl.initial;
        }
        // Initialise lists from declarations
        const lists = {};
        for (const [name, decl] of Object.entries(story.lists)) {
            lists[name] = decl.initial;
        }
        this.state = {
            passage: story.start ?? "",
            variables,
            lists,
            visited: {},
            consumed: {},
            ended: false,
        };
    }
    // ---- public API ----------------------------------------------------------
    /** Start the story from the current passage (or the declared start passage initially). */
    start() {
        if (this.state.ended) {
            return this.makeScene([], []);
        }
        return this.advance(this.state.passage);
    }
    /**
     * Select a choice by ID. The choice must be available at the current scene.

        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".json";
        input.addEventListener("change", () => {
            const file = input.files?.[0];
            if (!file) {
                resolve(null);
                return;
            }
            const reader = new FileReader();
            reader.addEventListener("load", () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (typeof parsed.passage !== "string" ||
                        typeof parsed.variables !== "object" ||
                        typeof parsed.consumed !== "object") {
                        resolve(null);
                        return;
                    }
                    if (Array.isArray(parsed.consumed)) {
                        console.warn("تنسيق الحفظ قديم — جارٍ تجاهل الخيارات المستهلكة." +
                            " القديم: مصفوفة، الجديد: لكل مقطع خياراته.");
                        parsed.consumed = {};
                    }
                    resolve(parsed);
                }
                catch {
                    resolve(null);
                }
            });
            reader.addEventListener("error", () => resolve(null));
            reader.readAsText(file);
        });
        // Handle cancel
        input.addEventListener("cancel", () => resolve(null));
        input.click();
    });
}
function sanitiseKey(title) {
    // Remove unsafe characters for localStorage key
    return title.replace(/[^a-zA-Z\u0600-\u06FF0-9_-]/g, "_").slice(0, 64);
}
// ---------------------------------------------------------------------------
// Aqlamna runtime — public entry point
// mount(storyJson, element) initialises and renders the player.
// ---------------------------------------------------------------------------
/**
 * Mount the runtime player into a DOM element.
 * Handles the full game loop: start → render → choose → advance → render.
 *
 * This is the ONLY game loop. The standalone export used to carry a
 * hand-written copy of it inside build-runtime.mjs, with its own onSave and
 * onLoad — which is how "save feedback is implemented" stayed true of this file
 * and false of every exported story for a day. The bootstrap now calls mount().
 *
 * Returns an unmount function that clears the element.
 */
function mount(storyJson, element, options = {}) {
    const showToolbar = options.showToolbar !== false;
    const title = storyJson.title ?? "قصة تفاعلية";
    // Mutable engine reference — replaced on restart
    let engine = new Engine(storyJson);
    // Every localStorage call is guarded. A browser in private mode throws on
    // read as well as write, and an unguarded throw here takes the whole click
    // handler down — the reader would press the button and get nothing, which is
    // exactly the "it looks dead" failure this work exists to remove.
    function bookmarkExists() {
        try {
            return hasLocalSave(title);
        }
        catch {
            return false;
        }
    }
    function render(scene, notice) {
        renderScene(element, scene, title, {
            onChoice: (choiceId) => {
                const next = engine.choose(choiceId);
                render(next);
            },
            onRestart: () => {
                engine = new Engine(storyJson);
                render(engine.start(), "بدأنا القصة من جديد");
            },
            hasBookmark: bookmarkExists,
            onBookmarkSet: () => {
                try {
                    saveToLocalStorage(title, engine.getState());
                    return "وضعنا العلامة";
                }
                catch {
                    return "تعذّر وضع العلامة";
                }
            },
            onBookmarkReturn: () => {
                let saved = null;
                try {
                    saved = loadFromLocalStorage(title);
                }
                catch {
                    saved = null;
                }
                // Nothing to go back to: no re-render happened, so this message is
                // the caller's to show. Every other path returns "".
                if (!saved)
                    return "تعذّرت العودة إلى العلامة";
                // Returning to a mark spends it — clear before restoring, so a
                // failure to clear cannot leave the reader at the mark with the
                // button still offering to take them back to where they already are.
                try {
                    clearLocalStorage(title);
                }
                catch {
                    return "تعذّرت العودة إلى العلامة";
                }
                engine.loadState(saved);
                render(engine.start(), "رجعنا إلى العلامة");
                return "";
            },
            showToolbar,
            onThemeToggle: options.onThemeToggle,
        }, notice);
    }
    // Initial render
    render(engine.start());
    return () => {
        element.innerHTML = "";
    };
}


// ---- Aqlamna standalone bootstrap -----------------------------------------
(function () {
  var storyEl = document.getElementById("qalam-story");
  if (!storyEl) return;
  var root = document.getElementById("qalam-player");
  if (!root) return;
  mount(JSON.parse(storyEl.textContent), root);
})();

})();

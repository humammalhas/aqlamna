<style id="aq-theme-light">
/* ---------------------------------------------------------------------------
   Aqlamna light theme — cream + ink blue.
   Values match site/assets/aqlamna.css :root.
   --------------------------------------------------------------------------- */

/* --- Page ----------------------------------------------------------------- */
/* html AND body both carry the background. Setting it on .aq-story alone left
   white margins around a cream card on every exported story. */

html, body {
  margin: 0;
  padding: 0;
  min-block-size: 100%;
  background: #F6F1E7;
  color: #2B2721;
  -webkit-text-size-adjust: 100%;
}

* { box-sizing: border-box; }

/* --- Container ------------------------------------------------------------ */

.aq-story {
  direction: ltr;
  text-align: start;
  font-family:
    "IBM Plex Sans Arabic",
    "Noto Sans Arabic",
    "Amiri",
    "Tajawal",
    system-ui,
    sans-serif;
  font-size: 1.125rem;
  line-height: 1.85;
  color: #2B2721;
  background: #F6F1E7;
  max-inline-size: 42rem;
  margin-inline: auto;
  padding: 2rem 1.5rem;

  /* The ink blue this theme already uses for the title and the end line. Named
     here so .aq-after-choice reads a token rather than repeating a hex. */
  --aq-after-choice: #1F3A5F;
}

/* --- Title ---------------------------------------------------------------- */

.aq-title {
  font-size: 1.75rem;
  font-weight: 700;
  color: #1F3A5F;
  text-align: center;
  margin-block-end: 2rem;
  border-block-end: 1px solid #D8CEBB;
  padding-block-end: 0.75rem;
}

/* --- Output / prose ------------------------------------------------------- */

.aq-output { margin-block-end: 1.5rem; }
.aq-text { margin-block: 0.75rem; text-indent: 0; }

/* The line a choice carries with it — the answer to the reader's own click,
   not part of the passage it lands in. Weight AND colour, because either alone
   reads as emphasis inside the prose rather than as a different voice. */
.aq-after-choice {
  font-weight: 700;
  color: var(--aq-after-choice);
  text-indent: 0;
}

/* --- Choices -------------------------------------------------------------- */

.aq-choices { display: flex; flex-direction: column; gap: 0.5rem; margin-block: 2rem; }

.aq-choice-btn {
  display: block; inline-size: 100%;
  padding-block: 0.75rem; padding-inline: 1.25rem;
  font-family: inherit; font-size: 1.0625rem; text-align: start;
  color: #2B2721; background: #EFE8DA;
  border: 1px solid #D8CEBB; border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.aq-choice-btn:hover { background: #E8E0CF; border-color: #5A5346; }
.aq-choice-btn:focus-visible { outline: 2px solid #1F3A5F; outline-offset: 2px; }

/* --- Images --------------------------------------------------------------- */

.aq-image {
  display: block;
  max-inline-size: 100%;
  block-size: auto;
  border-radius: 6px;
  margin-block: 1rem;
}

.aq-image-placeholder {
  display: block;
  max-inline-size: 100%;
  padding: 2rem;
  border: 2px dashed #D8CEBB;
  border-radius: 6px;
  margin-block: 1rem;
  text-align: center;
  color: #5A5346;
  font-size: 0.9375rem;
  line-height: 1.6;
}

/* --- End state ------------------------------------------------------------ */

.aq-end { text-align: center; margin-block: 3rem; }
.aq-end-text { font-size: 1.25rem; color: #1F3A5F; font-weight: 600; margin-block-end: 1.5rem; }

/* --- Toolbar -------------------------------------------------------------- */

.aq-toolbar {
  display: flex; justify-content: center; gap: 0.5rem;
  margin-block-start: 3rem; padding-block-start: 1.5rem;
  border-block-start: 1px solid #D8CEBB;
}

.aq-btn {
  padding-block: 0.5rem; padding-inline: 1rem;
  font-family: inherit; font-size: 0.875rem;
  color: #5A5346; background: transparent;
  border: 1px solid #D8CEBB; border-radius: 4px;
  cursor: pointer;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.aq-btn:hover { color: #2B2721; border-color: #2B2721; }
.aq-btn:focus-visible { outline: 2px solid #1F3A5F; outline-offset: 2px; }

/* --- Feedback ------------------------------------------------------------- */
.aq-feedback { font-size: 0.8125rem; color: #5A5346; margin-inline-start: 0.5rem; align-self: center; }

/* --- Responsive ----------------------------------------------------------- */

.aq-choice-btn { min-block-size: 48px; }
.aq-btn { min-block-size: 44px; }

@media (max-width: 40rem) {
  .aq-story {
    padding-inline: 1.125rem;
    padding-block: 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
    font-size: 1.0625rem;
  }
  .aq-title { font-size: 1.375rem; }
  .aq-toolbar { flex-wrap: wrap; margin-block-start: 2rem; }
  .aq-btn { min-inline-size: 44px; }
}

<script>
(function () {
  var THEMES = ["light", "dark", "book"];
  var STORY_KEY = "حرّاس الخزنة";

  function getTheme() {
    try { return localStorage.getItem("aq-theme-" + STORY_KEY) || "light"; }
    catch (e) { return "light"; }
  }

  function applyTheme(name) {
    for (var i = 0; i < THEMES.length; i++) {
      var el = document.getElementById("aq-theme-" + THEMES[i]);
      if (el) el.disabled = (THEMES[i] !== name);
    }
    try { localStorage.setItem("aq-theme-" + STORY_KEY, name); }
    catch (e) {}
  }

  window.__aqlamnaCycleTheme = function () {
    var current = getTheme();
    var idx = THEMES.indexOf(current);
    var next = THEMES[(idx + 1) % THEMES.length];
    applyTheme(next);
  };

  // Apply saved theme on load
  applyTheme(getTheme());
})();
</script>

<script id="qalam-story" type="application/json">{"qalam_version":"0.1","title":"Guardians of the Treasury","author":"Humam Malhas","language":"en","direction":"ltr","start":"كهف_الجد","variables":{"رمز_ذي_الشرى":{"type":"boolean","initial":false},"معه_القطعة_الأولى":{"type":"boolean","initial":false},"درب_سري":{"type":"boolean","initial":false},"اسم_الملك":{"type":"boolean","initial":false},"القطع":{"type":"number","initial":0}},"lists":{},"passages":{"كهف_الجد":{"tags":[],"content":[{"type":"image","name":"الجديدة"},{"type":"text","value":"Odeh climbed to the cave before the sun grew fierce — the cave where his grandfather had lived, before they were moved to Umm Sayhoun. He touched the cold wall, and the smell of old smoke, soaked into the stone for years, clung to his hand. He sat by the old hearth and raked the hardened ash with his fingers, and a small hollow appeared behind a loose stone. From it he drew a bundle of worn cloth and unwrapped it slowly. Inside lay a third of a bronze medallion, and a paper his grandfather had folded in a shaking hand, marked with a carved symbol: Dushara, god of the Nabataeans. Beneath it, a single line: \"What the king hid is three, not one — and the road begins at the Monastery.\""},{"type":"choices","items":[{"id":"choice_1","label":"Search the cave walls","sticky":true,"condition":null,"content":[{"type":"text","value":"Odeh ran his palm over the rock, but found only carvings the years had worn away."}],"divert":"كهف_الجد"},{"id":"choice_2","label":"Study the symbol of Dushara and commit it to memory","sticky":false,"condition":null,"content":[{"type":"set","var":"رمز_ذي_الشرى","op":"=","value":true}],"divert":"كهف_الجد"},{"id":"choice_3","label":"Pocket the bundle and head down to the valley","sticky":true,"condition":null,"content":[{"type":"set","var":"معه_القطعة_الأولى","op":"=","value":true},{"type":"set","var":"القطع","op":"+=","value":1}],"divert":"الوادي"}]}]},"الوادي":{"tags":[],"content":[{"type":"image","name":"الوادي"},{"type":"text","value":"Odeh went down the stony path toward the valley floor, gravel rolling under his sandal. At a bend in the rock he saw three men who were nothing like tourists: they carried surveying instruments and were photographing the cave mouths one by one. The tallest stepped forward and introduced himself — Doctor Morgan. He smiled a cold smile and said, in careful Arabic: \"We heard your grandfather left you something old. We keep such things safe in our museums, and we pay well.\" Odeh touched his pocket where the piece lay, and felt its cold weight. He knew the road to the Monastery was long, and that these men would not let him go."},{"type":"choices","items":[{"id":"choice_1","label":"Climb the long stairway to the Monastery","sticky":true,"condition":null,"content":[],"divert":"درج_الدير"},{"id":"choice_2","label":"Slip away by the goat trail your grandfather taught you","sticky":true,"condition":null,"content":[{"type":"set","var":"درب_سري","op":"=","value":true}],"divert":"درب_الماعز"}]}]},"درج_الدير":{"tags":[],"content":[{"type":"image","name":"درج_الدير"},{"type":"text","value":"Odeh climbed hundreds of steps cut into the mountain, his legs burning and sweat running down his back. He passed souvenir sellers and laden donkeys, and now and then he glimpsed Morgan's men trailing him from a distance. When he reached the top, the great Monastery opened before him, carved into the rock, and a cool wind blew across his wet face."},{"type":"choices","items":[{"id":"choice_1","label":"Enter the Monastery chamber","sticky":true,"condition":null,"content":[],"divert":"قاعة_الدير"}]}]},"درب_الماعز":{"tags":[],"content":[{"type":"image","name":"درب_الماعز"},{"type":"text","value":"Odeh slipped into a narrow passage between the rocks, known only to the Bdoul herders. He walked a ledge wide enough for a single foot, and the scent of wild thyme rose from the cracks. He heard nothing behind him but the wind; Morgan's men had lost his trail. He came out suddenly behind the Monastery, where the tourists never reach."},{"type":"choices","items":[{"id":"choice_1","label":"Enter the Monastery chamber","sticky":true,"condition":null,"content":[],"divert":"قاعة_الدير"}]}]},"قاعة_الدير":{"tags":[],"content":[{"type":"image","name":"قاعة_الدير"},{"type":"text","value":"Odeh entered a chamber carved behind the Monastery's face, and cold, damp air closed around him. The echo of his own breath ran along the walls. Deep inside stood three carved niches, above them a line of old Nabataean script, and below them a narrow slot the size of a third of a medallion. He had to touch the niche that stood for Dushara; if he chose wrong, the door would seal behind him."},{"type":"conditional","condition":{"var":"رمز_ذي_الشرى"},"then":[{"type":"text","value":"Odeh remembered what he had learned from his grandfather's paper: the Nabataeans did not give their gods faces — Dushara, to them, was a plain standing stone with no features at all."}],"else":[]},{"type":"conditional","condition":{"not":{"var":"رمز_ذي_الشرى"}},"then":[{"type":"text","value":"Odeh stared at the faded symbols and understood nothing. He had not read his grandfather's paper with care, and the niches stayed a riddle."}],"else":[]},{"type":"conditional","condition":{"var":"درب_سري"},"then":[{"type":"text","value":"There was no sound of Morgan's men here; he had beaten them by the hidden trail, and had time to spare."}],"else":[]},{"type":"choices","items":[{"id":"choice_1","label":"Touch the plain standing stone","sticky":true,"condition":null,"content":[{"type":"set","var":"اسم_الملك","op":"=","value":true},{"type":"set","var":"القطع","op":"+=","value":1}],"divert":"القطعة_الثانية"},{"id":"choice_2","label":"Touch the statue with the carved face","sticky":true,"condition":null,"content":[],"divert":"العقرب"},{"id":"choice_3","label":"Touch the eagle relief","sticky":true,"condition":null,"content":[],"divert":"العقرب"}]}]},"القطعة_الثانية":{"tags":[],"content":[{"type":"image","name":"القطعة_الثانية"},{"type":"text","value":"The stone slid aside quietly, and a small hollow opened behind it. Odeh reached in and drew out another third of the medallion, cold and gleaming. On the wall of the hollow a name was carved, clear and plain: Aretas the Fourth, king of the Nabataeans, lover of his people. Below the name, an engraved arrow pointed toward the Treasury."},{"type":"choices","items":[{"id":"choice_1","label":"Head out toward the Treasury","sticky":true,"condition":null,"content":[],"divert":"الطريق_إلى_الخزنة"}]}]},"العقرب":{"tags":[],"content":[{"type":"image","name":"العقرب"},{"type":"text","value":"The moment Odeh touched the stone, a grinding sound rang out, and a slab of rock slid down and sealed the entrance. The chamber drowned in darkness but for a thin sliver of light. He heard a rustle at his foot and saw a yellow scorpion raise its tail above the sand. He set his back against the cold wall, the piece in his pocket useless to him now."},{"type":"divert","target":"END"}]},"الطريق_إلى_الخزنة":{"tags":[],"content":[{"type":"image","name":"الطريق_إلى_الخزنة"},{"type":"text","value":"Odeh made his way back through the Siq toward the Treasury, both pieces in his pocket. The passage narrowed until the rock nearly brushed his shoulders, and the shade turned suddenly cold. In the wall gleamed an old Nabataean water channel, still carrying a faint damp. At the end of the Siq the Treasury appeared, rose-red in the afternoon light — but three shadows moved before its door: Morgan's men had gotten there first."},{"type":"choices","items":[{"id":"choice_1","label":"Move toward the Treasury","sticky":true,"condition":null,"content":[],"divert":"أمام_الخزنة"}]}]},"أمام_الخزنة":{"tags":[],"content":[{"type":"image","name":"أمام_الخزنة"},{"type":"text","value":"Odeh stopped at the edge of the plaza, the Treasury towering above him with its carved columns. Morgan came forward calmly and held out his hand: \"The pieces, son, before we take them ourselves.\" The two men spread out to either side. Odeh caught sight of a small side door, carved into the flank of the Treasury, dark and narrow."},{"type":"choices","items":[{"id":"choice_1","label":"Run across the open plaza","sticky":true,"condition":null,"content":[],"divert":"الأسر"},{"id":"choice_2","label":"Fight them with your fists","sticky":true,"condition":null,"content":[{"type":"text","value":"Odeh threw a fist at the nearest man, but they were three and he was one, and they closed on him and threw him down onto the gravel."}],"divert":"الأسر"},{"id":"choice_3","label":"Slip into the side chamber","sticky":true,"condition":null,"content":[],"divert":"غرفة_الخزنة"}]}]},"غرفة_الخزنة":{"tags":[],"content":[{"type":"image","name":"غرفة_الخزنة"},{"type":"text","value":"Odeh slipped into a dark side chamber, where the second piece's arrow had pointed. Every sound behind him fell still. At its center stood a stone altar, and on it a round lock ringed by three seals. In a niche above the altar lay the last third of the medallion — the Nabataeans had hidden it at the door of their treasure, so the key could be joined here and nowhere else. Odeh took it and pressed the three thirds together; they fused into a single disc that slid into the heart of the lock. Above the seals a line was carved: \"Open with what the king loved for his people.\""},{"type":"conditional","condition":{"var":"اسم_الملك"},"then":[{"type":"text","value":"Odeh remembered the carved title: Aretas the Fourth, lover of his people. And he asked himself: what does a man who loves his people leave behind? Not gold to be plundered, but what outlasts him."}],"else":[]},{"type":"conditional","condition":{"not":{"var":"اسم_الملك"}},"then":[{"type":"text","value":"Three seals, alike, and Odeh could recall nothing to point him to the right one."}],"else":[]},{"type":"choices","items":[{"id":"choice_1","label":"Press the manuscript seal","sticky":true,"condition":null,"content":[],"divert":"الكنز"},{"id":"choice_2","label":"Press the bag-of-gold seal","sticky":true,"condition":null,"content":[],"divert":"الأبواب"},{"id":"choice_3","label":"Press the crown seal","sticky":true,"condition":null,"content":[],"divert":"الأبواب"}]}]},"الأسر":{"tags":[],"content":[{"type":"image","name":"الأسر"},{"type":"text","value":"Odeh had not crossed half the plaza when strong hands closed on him. Morgan pulled the two pieces from his pocket, raised them into the light, and smiled. Odeh was dragged across the gravel, the Treasury receding behind him, the two pieces now in a stranger's hand."},{"type":"divert","target":"END"}]},"الأبواب":{"tags":[],"content":[{"type":"image","name":"الأبواب"},{"type":"text","value":"The moment he pressed the seal, a deep grinding rang out, and the chamber walls began to slide toward one another with a slowness that could not be resisted. Odeh ran for the entrance, but the stone shut two fingers before he reached it. Complete darkness fell, and nothing remained but the sound of his own breathing and the cold disc in his hand."},{"type":"divert","target":"END"}]},"الكنز":{"tags":[],"content":[{"type":"image","name":"الكنز"},{"type":"text","value":"The seal turned slowly, the wall shuddered, and a narrow room opened. Odeh found no heaped gold, as Morgan had imagined, but shelves of Nabataean scrolls: maps of the water channels that had brought the desert to life, and records of the names of families who had lived in these mountains two thousand years before. Among them lay a single gold coin, nearly lost between the pages. Odeh carried a brittle scroll toward the mouth of the room, where daylight seeped in — and high above stood the Treasury's stone urn, pocked by the bullets of the greedy who had hunted for gold that was never inside it."},{"type":"divert","target":"END"}]}},"metadata":{"created":"2026-08-02T06:35:32.573Z","modified":"2026-08-02T06:35:32.573Z","passage_count":13,"word_count":780},"images":{"الجديدة":{"alt":"Odeh crouches inside a cave carved into the rose-red rock of Petra, opening a cloth bundle in his hands, a shaft of light from the cave mouth lighting the dust in the air.","data":"data:image/webp;base64,UklGRlDlAABXRUJQVlA4WAoAAAAgAAAA/wIAPwIASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggYuMAABACBJ0BKgADQAI+USKORaOiIScmE+xQ4AoJZW3ZskM92AoK67jHYX1OeU9g/uO7MXQaAHGVzxP+f6VU9DzAeQ5X1Zca/cs9frL22KlBn2LvU15kv7J+tb1h+cPzOPzQ+B/lc9eb6PXTPWn75V13/mX2v/S/xPo8Zo+2z/v9DP53+qf7n+f9oX+t4n8B33pwzV63opfqfth7K/sv/A9gn+e/3b09/83kl/n/+1/4/+R8BP9d/zv/p/zPvG/8X7i+j/9u/5H/2/3vwG/0b/E/+T17////3vg9+8X/8/9fwx/uD/+DySOtIBbPVUCIHN6IXiU17lg2rNFsa2ARDdUpOR2lcKBk6i/yNvgkKPf/ZUCK0A2vyhsuQ/h0Pn2t7Cjx3qGM/zSVxbNXY1jLgO05+zqnVaUQ2OlavjfCDUtovox0wUF+IBsyqnhKBa/jBhSTrrqjMDs9WjHuKIfpB0pvdPK0tgzgA/K/MWY5diPubeFXMr0EtHwf2HkNwhH7N0pzieBfjk+l21eYa25xnpF75115/NW0AtMsMdukHDaPq1GQhvKXzb+/9J5aJZsbowsl2GeNK4TA/oqxJABuJeUvp2rT3dthw+uCmokXkzXxmih5fsaRBj4p2lEg0QenfpNasOG8VHCMq3G9gyZ6ic1+xkisT6YdD2FU7WJHg/D+8i344vhlGJFLRGyY7ejxuatFkTAUMD0zkxZOS0Eesmc4Q3U5KhsDpH0Hcb3U7wvSx07Ko5FpYgmsGdN0+xdkBUetS8/RIqby+Ybolx3S3eQUkQSTy5FJksoCj63B6ivcyeHIoY28iM1i85hlsacJ0q1CDMTMK9u4Bd46AOKp08NpjLDv/CsI+q4oy5JqVoJ8S/4C86TewUtwpH7eSUds79GRANWOFY9rAXlICj1oCBz+5vDhQxzP+YDeaxl9OJTAgLblsCsOEMXiuweV4dyIsU6g7sa0yFGxbo+6RPwjZgKeBG+BD00uEPVZQg7JbCvJh+vKzsG1rBql176+cQK8w4Qx6TjQdObYrqktCyfMQm1rBAiGVvlrMbngYhoK8E9Fa4qYuFELrJ+we0We4Wwfp90Jwizhz93NR+wIKnXPnLwcDpXBRGBc7cni0ckogH+olc9R4R8Kvul0AlHaOZ3u <script>
(function () {
// ---------------------------------------------------------------------------
// Aqlamna runtime types — the story JSON shape the engine consumes
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Aqlamna runtime engine — state machine
// Zero dependencies. Consumes compiled story JSON.
// ---------------------------------------------------------------------------
// ---- engine ----------------------------------------------------------------
class Engine {
    story;
    state;
    constructor(story) {
        this.story = story;
        // Initialise variables from declarations
        const variables = {};
        for (const [name, decl] of Object.entries(story.variables)) {
            variables[name] = decl.initial;
        }
        // Initialise lists from declarations
        const lists = {};
        for (const [name, decl] of Object.entries(story.lists)) {
            lists[name] = decl.initial;
        }
        this.state = {
            passage: story.start ?? "",
            variables,
            lists,
            visited: {},
            consumed: {},
            ended: false,
        };
    }
    // ---- public API ----------------------------------------------------------
    /** Start the story from the current passage (or the declared start passage initially). */
    start() {
        if (this.state.ended) {
            return this.makeScene([], []);
        }
        return this.advance(this.state.passage);
    }
    /**
     * Select a choice by ID. The choice must be available at the current scene.
     * Processes the choice's content, applies side effects, then follows its divert
     * (or stays in the current passage if none).
     */
    choose(choiceId) {
        if (this.state.ended) {
            return this.makeScene([], []);
        }
        // Find the choice in the current passage content tree
        const passage = this.story.passages[this.state.passage];
        if (!passage) {
            this.state.ended = true;
            return this.makeScene([], []);
        }
        const item = this.findChoice(passage.content, choiceId);
        if (!item) {
            return this.makeScene([], []);
        }
        // Consume the choice (sticky choices are never consumed).
        // Keyed by (passage, choiceId) per PHASE1_SPEC.md §1.4.
        if (!item.sticky) {
            const passageConsumed = this.state.consumed[this.state.passage] ?? [];
            if (!passageConsumed.includes(choiceId)) {
                passageConsumed.push(choiceId);
                this.state.consumed[this.state.passage] = passageConsumed;
            }
        }
        // Process the choice's content
        const choiceOutput = [];
        const contentResult = this.processContent(item.content, choiceOutput);
        // Mark it as the choice's own. Everything below carries this array into
        // another passage's output, where nothing else can tell the two apart —
        // the renderer reads the mark to keep the destination's opening image at
        // the top of the passage and to style the beat as the answer to a click.
        for (const node of choiceOutput) {
            node.afterChoice = true;
        }
        // If choice content itself contains choices (nested choices),
        // return immediately with the content output + those choices.
        if (contentResult.kind === "choices") {
            return this.makeScene(choiceOutput, contentResult.items);
        }
        // Determine the next passage:
        //   1. Content contains a divert node → follow it
        //   2. Choice has a divert field → follow it
        //   3. Neither → stay in current passage
        let nextPassage;
        if (contentResult.kind === "divert") {
            nextPassage = contentResult.target;
        }
        else if (item.divert !== null) {
            nextPassage = item.divert;
        }
        else {
            nextPassage = this.state.passage;
        }
        // Advance to the next passage, carrying choice content output as prefix
        return this.advance(nextPassage, choiceOutput);
    }
    /** Return a serialisable snapshot of the current engine state. */
    getState() {
        return {
            save_version: 2,
            passage: this.state.passage,
            variables: { ...this.state.variables },
            lists: { ...this.state.lists },
            visited: { ...this.state.visited },
            consumed: deepCloneConsumed(this.state.consumed),
            ended: this.state.ended,
        };
    }
    /** Restore the engine from a previously saved state. */
    loadState(state) {
        // Handle old v1 format: consumed was a flat string[].
        // Discard it gracefully — no real users yet.
        let consumed;
        if (Array.isArray(state.consumed)) {
            console.warn("Old save format — ignoring consumed choices." +
                " old: array, new: per-passage choices.");
            consumed = {};
        }
        else {
            consumed = deepCloneConsumed(state.consumed ?? {});
        }
        this.state = {
            save_version: 2,
            passage: state.passage,
            variables: { ...state.variables },
            lists: { ...state.lists },
            visited: { ...state.visited },
            consumed,
            ended: state.ended,
        };
    }
    // ---- advance loop --------------------------------------------------------
    /**
     * Process passages starting from `fromPassage`.
     * Follows diverts automatically. Pauses when choices are found or the story ends.
     */
    advance(fromPassage, prefixOutput) {
        const output = prefixOutput ? [...prefixOutput] : [];
        let current = fromPassage;
        for (;;) {
            // Terminal targets
            if (current === "END") {
                this.state.passage = "END";
                this.state.ended = true;
                return this.makeScene(output, []);
            }
            if (current === "DONE") {
                this.state.passage = "DONE";
                this.state.ended = true;
                return this.makeScene(output, []);
            }
            const passage = this.story.passages[current];
            if (!passage) {
                this.state.passage = current;

            this.state.visited[current] = (this.state.visited[current] ?? 0) + 1;

                case "choices":

    processContent(content, output) {

            switch (node.type) {
                case "text": {
                    // PHASE1_SPEC §1.16. The compiled JSON encodes a line break inside a
                    // paragraph as a text node whose value is null; a paragraph boundary
                    // is encoded implicitly, as two adjacent prose text nodes with no
                    // sentinel between them. Turn both into explicit output nodes here so
                    // the renderer never has to guess.
                    if (node.value === null) {

                    break;

                case "tunnel":
                    return { kind: "divert", target: node.target };
                case "divert_return":

                    // treats this as end-of-passage.
                    return { kind: "done" };

                    if (tp) {

                        if (sub.kind !== "done")

                    }
                    break;

                case "conditional": {
                    const branch = this.evalCondition(node.condition)
                        ? node.then
                        : node.else;
                    const sub = this.processContent(branch, output);
                    if (sub.kind !== "done")
                        return sub;
                    break;
                }
                case "image": {
                    const asset = this.story.images?.[node.name];
                    output.push({
                        type: "image",
                        alt: asset?.alt ?? node.name,
                        data: asset?.data,
                    });
                    break;
                }
                case "choices": {
                    const available = node.items.filter((item) => this.isChoiceAvailable(item));
                    if (available.length > 0) {
                        return {
                            kind: "choices",

                                id: item.id,
                                label: item.label,
                                sticky: item.sticky,

    // ---- condition evaluation ------------------------------------------------

            if (passageConsumed.includes(item.id)) {

            case "!=": return value !== expected;

                break;
            case "-=":
                this.state.variables[varName] = current - rhs;
                break;
            case "*=":

                    if (nested)
                        return nested;
                }
            }
            if (node.type === "conditional") {
                const inThen = this.findChoice(node.then, choiceId);
                if (inThen)
                    return inThen;
                const inElse = this.findChoice(node.else, choiceId);
                if (inElse)
                    return inElse;
            }
            if (node.type === "thread") {
                const tp = this.story.passages[node.target];
                if (tp) {

}
// ---- helpers (module-level) ------------------------------------------------
/** Deep-clone the per-passage consumed map. */
function deepCloneConsumed(consumed) {
    const clone = {};
    for (const [key, ids] of Object.entries(consumed)) {

}
// ---------------------------------------------------------------------------
// Aqlamna runtime renderer — DOM rendering, RTL-first
// Zero dependencies. Uses CSS logical properties only.
// ---------------------------------------------------------------------------
/**
 * One button, two directions. The label names what the NEXT press will do.
 *
 * It replaced two buttons that were one idea split in half: both were named
 * after storage rather than after direction, so neither said which way the
 * reader was going, and their icons — a floppy disk and a file folder — came
 * from an office rather than from a book. A ribbon belongs to a book.
 *
 * The retired strings are deliberately not quoted here. This comment is inlined
 * verbatim into every exported story, and a grep of the shipped artifact asking
 * "are the old buttons gone?" must not be answered by this file. That assertion
 * lives in tests/embedded-toolbar.spec.ts, which does not ship.

const MARK_SET = "🔖 Bookmark";

    return marked ? MARK_RETURN : MARK_SET;
}
/**

 * accented in all three themes so a reader can see at a glance which sentence
 * their own hand caused.

const FEEDBACK_MS = 3500;
/**
 * Renders a story scene into a container element.
 * Creates RTL-first DOM with choice buttons.

function renderScene(container, scene, title, options, notice) {
    container.innerHTML = "";

    // of its output (engine.ts → choose → advance), marked `afterChoice`. Drawn

    // the reader saw the answer to their click, then the photograph of the place
    // they had only just arrived in. The picture is the top of the passage.

    emit(beat, AFTER_CHOICE_CLASS);
    emit(passage.slice(leadImages), TEXT_CLASS);
    wrapper.appendChild(outputEl);
    // Choices

        const choicesEl = document.createElement("div");
        choicesEl.className = "aq-choices";

            const btn = document.createElement("button");
            btn.className = "aq-choice-btn";
            btn.textContent = choice.label;
            btn.addEventListener("click", () => {
                options.onChoice(choice.id);
            });
            choicesEl.appendChild(btn);

        const endEl = document.createElement("div");
        endEl.className = "aq-end";
        const endText = document.createElement("p");
        endText.className = "aq-text aq-end-text";
        endText.textContent = "The End.";
        endEl.appendChild(endText);
        const restartBtn = document.createElement("button");
        restartBtn.className = "aq-btn aq-restart-btn";
        restartBtn.textContent = "⟲ Restart story";
        restartBtn.addEventListener("click", options.onRestart);
        endEl.appendChild(restartBtn);
        wrapper.appendChild(endEl);
    }
    // Toolbar — bookmark / restart.
    //
    // Omitted entirely when the story is running inside a frame. An embedded
    // story is a preview of what the engine does, not somebody's reading
    // session: there is nothing worth bookmarking, a mark would be shared with
    // whoever opens the story directly, and the buttons add chrome to a box that
    // is already shorter than its content.
    //
    // Not an empty toolbar — no element at all, so the border, the 3rem margin
    // and the height all go with it.
    if (options.showToolbar !== false && !isEmbedded()) {
        const toolbar = document.createElement("div");
        toolbar.className = "aq-toolbar";
        const markBtn = document.createElement("button");
        markBtn.className = "aq-btn aq-mark-btn";
        let marked = options.hasBookmark();
        markBtn.textContent = markLabel(marked);
        markBtn.addEventListener("click", () => {
            // Do what the label promised, not what a fresh reading of storage says.
            // If the mark disappeared between paint and press — another tab, a
            // cleared browser — the reader pressed "go back to the mark"; quietly
            // placing a new one instead is the button doing the opposite of what it
            // said. onBookmarkReturn reports the loss and nothing moves.
            const msg = marked ? options.onBookmarkReturn() : options.onBookmarkSet();
            // Ask now, though, rather than assuming the press succeeded — a full disk
            // or a blocked localStorage leaves the mark exactly where it was, and a
            // label that flipped anyway would lie about what the NEXT press does.
            marked = options.hasBookmark();
            markBtn.textContent = markLabel(marked);
            showFeedback(toolbar, msg);
        });
        toolbar.appendChild(markBtn);
        // Theme toggle button — only shown if callback is provided
        if (options.onThemeToggle) {
            const themeBtn = document.createElement("button");
            themeBtn.className = "aq-btn aq-theme-btn";
            themeBtn.textContent = "🎨";
            themeBtn.title = "Change theme";
            themeBtn.addEventListener("click", options.onThemeToggle);
            toolbar.appendChild(themeBtn);
        }
        if (scene.choices.length > 0 || !scene.ended) {
            const restartBtn = document.createElement("button");
            restartBtn.className = "aq-btn aq-restart-btn";
            restartBtn.textContent = "⟲ Restart";
            restartBtn.addEventListener("click", options.onRestart);
            toolbar.appendChild(restartBtn);
        }
        wrapper.appendChild(toolbar);
        // The confirmation for whatever caused this render. Written after the
        // toolbar exists, because it lives inside it.
        if (notice)
            showFeedback(toolbar, notice);
    }

}
/**
 * True when this document is running inside a frame.
 *
 * Comparing `window.self` to `window.top` is safe across origins — it compares
 * two references and never reads a property of the other document, so it does
 * not throw the way `window.top.location` would.

 * scope at all. Without it every renderer test throws ReferenceError.
 */
function isEmbedded() {
    return typeof window !== "undefined" && window.self !== window.top;
}
/**
 * Show a confirmation beside the buttons.
 *
 * A `<span>` appended INTO `.aq-toolbar`, which is `display: flex` — so it is
 * one more item on the same row, vertically centred by `align-self: center`.

 * had done anything, and anything that pushes it onto a line of its own puts it
 * where nobody is looking.

    // "" is how a handler says "I re-rendered, the message went with the render".
    // Appending an empty span would still shift the centred row.
    if (!msg)

    if (old)
        old.remove();
    const span = document.createElement("span");
    span.className = "aq-feedback";

/**
 * Render an image output node.

function renderImage(node) {
    if (node.data) {
        const img = document.createElement("img");
        img.className = "aq-image";
        img.src = node.data;
        img.alt = node.alt;
        return img;
    }

    placeholder.className = "aq-image-placeholder";

// ---------------------------------------------------------------------------
// Aqlamna runtime save/restore — localStorage + download/upload
// Zero dependencies.
// ---------------------------------------------------------------------------
// The key the reader's bookmark lives under. Unchanged since the toolbar said

// button wrote, so every position saved before this change is still there and
// still reachable — it just answers to a different label now.
const STORAGE_KEY_PREFIX = "aqlamna_save_";
/**
 * Save game state to localStorage under a story-specific key.
 * Returns the key used.

function saveToLocalStorage(storyTitle, state) {
    const key = STORAGE_KEY_PREFIX + sanitiseKey(storyTitle);
    const data = JSON.stringify(state);
    localStorage.setItem(key, data);
    return key;
}
/**
 * Restore game state from localStorage.
 * Returns null if no save exists for this story.

function loadFromLocalStorage(storyTitle) {
    const key = STORAGE_KEY_PREFIX + sanitiseKey(storyTitle);
    const raw = localStorage.getItem(key);
    if (!raw)
        return null;
    try {
        const parsed = JSON.parse(raw);
        // Basic validation
        if (typeof parsed.passage !== "string" ||
            typeof parsed.variables !== "object" ||
            typeof parsed.consumed !== "object") {
            return null;
        }
        // Handle old v1 format: consumed was a flat string[].
        if (Array.isArray(parsed.consumed)) {
            console.warn("Old save format — ignoring consumed choices." +
                " old: array, new: per-passage choices.");

        return parsed;
    }

    }
}
/**
 * True when this story has a bookmark stored.

 * reported when the reader presses, not by silently offering the other label.

/**
 * Remove this story's bookmark.

 * so the slot has to be emptied by the same press that consumes it.

function clearLocalStorage(storyTitle) {

/**

/**

                        typeof parsed.consumed !== "object") {

                        return;

// ---------------------------------------------------------------------------
// Aqlamna runtime — public entry point
// mount(storyJson, element) initialises and renders the player.
// ---------------------------------------------------------------------------
/**
 * Mount the runtime player into a DOM element.
 * Handles the full game loop: start → render → choose → advance → render.
 *
 * This is the ONLY game loop. The standalone export used to carry a
 * hand-written copy of it inside build-runtime.mjs, with its own onSave and
 * onLoad — which is how "save feedback is implemented" stayed true of this file

 *

 */
function mount(storyJson, element, options = {}) {
    const showToolbar = options.showToolbar !== false;
    const title = storyJson.title ?? "Interactive story";
    // Mutable engine reference — replaced on restart
    let engine = new Engine(storyJson);
    // Every localStorage call is guarded. A browser in private mode throws on
    // read as well as write, and an unguarded throw here takes the whole click

            return hasLocalSave(title);
        }

            return false;
        }

        renderScene(element, scene, title, {
            onChoice: (choiceId) => {
                const next = engine.choose(choiceId);
                render(next);
            },
            onRestart: () => {
                engine = new Engine(storyJson);
                render(engine.start(), "Story restarted");
            },
            hasBookmark: bookmarkExists,
            onBookmarkSet: () => {
                try {
                    saveToLocalStorage(title, engine.getState());
                    return "Bookmark set";
                }
                catch {
                    return "Could not set the bookmark";
                }
            },
            onBookmarkReturn: () => {
                let saved = null;
                try {
                    saved = loadFromLocalStorage(title);
                }
                catch {
                    saved = null;
                }
                // Nothing to go back to: no re-render happened, so this message is
                // the caller's to show. Every other path returns "".
                if (!saved)
                    return "Could not return to the bookmark";
                // Returning to a mark spends it — clear before restoring, so a
                // failure to clear cannot leave the reader at the mark with the
                // button still offering to take them back to where they already are.
                try {
                    clearLocalStorage(title);
                }
                catch {
                    return "Could not return to the bookmark";
                }
                engine.loadState(saved);
                render(engine.start(), "Returned to bookmark");
                return "";
            },
            showToolbar,
            onThemeToggle: options.onThemeToggle,
        }, notice);
    }
    // Initial render
    render(engine.start());
    return () => {
        element.innerHTML = "";
    };
}


// ---- Aqlamna standalone bootstrap -----------------------------------------
(function () {
  var storyEl = document.getElementById("qalam-story");
  if (!storyEl) return;
  var root = document.getElementById("qalam-player");
  if (!root) return;
  mount(JSON.parse(storyEl.textContent), root);
})();

})();

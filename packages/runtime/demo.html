<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرحيق — Aqlamna</title>
  <style>
    /* Inline dark theme — CSS logical properties only, self-hosted fonts */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #1a1814;
    }

    body {
      min-block-size: 100vh;
      direction: rtl;
    }

    /* Font stack per design §7.4 — self-hosted, no Google Fonts link */
    .aq-story {
      direction: rtl;
      text-align: start;
      font-family:
        "IBM Plex Sans Arabic",
        "Noto Sans Arabic",
        "Amiri",
        "Tajawal",
        system-ui,
        sans-serif;
      font-size: 1.125rem;
      line-height: 1.85;
      color: #e0d6c2;
      background: #1a1814;
      max-inline-size: 42rem;
      margin-inline: auto;
      padding: 2rem 1.5rem;
    }

    .aq-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #d4a843;
      text-align: center;
      margin-block-end: 2rem;
      border-block-end: 1px solid #3a3528;
      padding-block-end: 0.75rem;
    }

    .aq-output {
      margin-block-end: 1.5rem;
    }

    .aq-text {
      margin-block: 0.75rem;
      text-indent: 0;
    }

    .aq-choices {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-block: 2rem;
    }

    .aq-choice-btn {
      display: block;
      inline-size: 100%;
      padding-block: 0.75rem;
      padding-inline: 1.25rem;
      font-family: inherit;
      font-size: 1.0625rem;
      text-align: start;
      color: #e0d6c2;
      background: #2a2620;
      border: 1px solid #4a4030;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .aq-choice-btn:hover {
      background: #3a3528;
      border-color: #8a7040;
    }

    .aq-choice-btn:focus-visible {
      outline: 2px solid #d4a843;
      outline-offset: 2px;
    }

    .aq-end {
      text-align: center;
      margin-block: 3rem;
    }

    .aq-end-text {
      font-size: 1.25rem;
      color: #d4a843;
      font-weight: 600;
      margin-block-end: 1.5rem;
    }

    .aq-toolbar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-block-start: 3rem;
      padding-block-start: 1.5rem;
      border-block-start: 1px solid #3a3528;
    }

    .aq-btn {
      padding-block: 0.5rem;
      padding-inline: 1rem;
      font-family: inherit;
      font-size: 0.875rem;
      color: #9a8c70;
      background: transparent;
      border: 1px solid #3a3528;
      border-radius: 4px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .aq-btn:hover {
      color: #d4a843;
      border-color: #5a4a30;
    }

    .aq-btn:focus-visible {
      outline: 2px solid #d4a843;
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      .aq-story {
        padding: 1rem;
        font-size: 1rem;
      }
      .aq-title {
        font-size: 1.375rem;
      }
    }
  </style>
</head>
<body>
  <div id="aq-root"></div>

  <!-- Inline the compiled fixture 03 JSON -->
  <script type="module">
    // The runtime engine is inlined below — zero dependencies.
    // In production, a bundler would concatenate these.

    // ==== types.ts (inlined) ====
    // (types are erased at runtime — structural only)

    // ==== engine.ts (inlined) ====
    // See src/engine.ts for the full source.
    // This demo uses the module import in development.
    // For the standalone export (step 7), a build script will inline everything.

    // For now, load the engine from the module system.
    import { Engine } from "./src/engine.js";

    // Story JSON embedded directly.
    const story = {
      "qalam_version": "0.1",
      "title": "الرحيق",
      "author": null,
      "language": "ar",
      "direction": "rtl",
      "start": "البداية",
      "variables": {
        "الرحيق": { "type": "number", "initial": 0 },
        "وجد_الخريطة": { "type": "boolean", "initial": false },
        "اسم_البطل": { "type": "string", "initial": "نحلة" }
      },
      "lists": {},
      "passages": {
        "البداية": {
          "tags": [],
          "content": [
            {
              "type": "conditional",
              "condition": { "var": "وجد_الخريطة" },
              "then": [
                { "type": "text", "value": "الخريطة معك." }
              ],
              "else": []
            },
            { "type": "text", "value": "جمعتِ " },
            { "type": "interpolation", "var": "الرحيق" },
            { "type": "text", "value": " قطرة." },
            {
              "type": "choices",
              "items": [
                {
                  "id": "choice_1",
                  "label": "اجمع الرحيق",
                  "sticky": true,
                  "condition": null,
                  "content": [
                    { "type": "set", "var": "الرحيق", "op": "+=", "value": 2 }
                  ],
                  "divert": "البداية"
                },
                {
                  "id": "choice_2",
                  "label": "تحدثي مع النحلة الحكيمة",
                  "sticky": false,
                  "condition": null,
                  "content": [
                    { "type": "set", "var": "وجد_الخريطة", "op": "=", "value": true }
                  ],
                  "divert": "البداية"
                },
                {
                  "id": "choice_3",
                  "label": "عودي إلى الخلية",
                  "sticky": true,
                  "condition": { "var": "الرحيق", "op": ">=", "value": 4 },
                  "content": [],
                  "divert": "END"
                }
              ]
            }
          ]
        }
      }
    };

    // Simple renderer — builds DOM directly (replaces the full renderer.ts)
    const root = document.getElementById("aq-root");
    const engine = new Engine(story);

    function render(scene) {
      root.innerHTML = "";

      const wrapper = document.createElement("div");
      wrapper.className = "aq-story";

      const titleEl = document.createElement("h1");
      titleEl.className = "aq-title";
      titleEl.textContent = story.title;
      wrapper.appendChild(titleEl);

      const outputEl = document.createElement("div");
      outputEl.className = "aq-output";
      for (const node of scene.output) {
        const p = document.createElement("p");
        p.className = "aq-text";
        p.textContent = node.value;
        outputEl.appendChild(p);
      }
      wrapper.appendChild(outputEl);

      if (scene.choices.length > 0) {
        const choicesEl = document.createElement("div");
        choicesEl.className = "aq-choices";
        for (const choice of scene.choices) {
          const btn = document.createElement("button");
          btn.className = "aq-choice-btn";
          btn.textContent = choice.label;
          btn.addEventListener("click", () => {
            const next = engine.choose(choice.id);
            render(next);
          });
          choicesEl.appendChild(btn);
        }
        wrapper.appendChild(choicesEl);
      }

      if (scene.ended && scene.choices.length === 0) {
        const endEl = document.createElement("div");
        endEl.className = "aq-end";
        const endText = document.createElement("p");
        endText.className = "aq-text aq-end-text";
        endText.textContent = "انتهت القصة.";
        endEl.appendChild(endText);
        const restartBtn = document.createElement("button");
        restartBtn.className = "aq-btn";
        restartBtn.textContent = "⟲ أعد القصة";
        restartBtn.addEventListener("click", () => {
          window.location.reload();
        });
        endEl.appendChild(restartBtn);
        wrapper.appendChild(endEl);
      }

      root.appendChild(wrapper);
    }

    render(engine.start());
  </script>
</body>
</html>
